services:
  - type: web
    name: fyp-management-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: fyp_management
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://fyp-management-system.onrender.com
      - key: NODE_ENV
        value: production
  - type: web
    runtime: static
    name: fyp-management-system
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://fyp-management-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
